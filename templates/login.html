<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CineMatch</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background: #090909;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 380px;
            max-width: 90%;
            margin: 100px auto;
            padding: 35px;
            background: #181818;
            border-radius: 12px;
            text-align: center;
        }

        .login-container span {
            color: #e50914;
        }

        .login-container input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            background: #292929;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .login-container button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-container a {
            color: #e50914;
            text-decoration: none;
        }

        .message {
            color: #ff7777;
        }
    </style>

</head>

<body>

    <div class="login-container">

        <h1>CINE<span>MATCH</span></h1>

        <h2>Welcome Back!</h2>

        <p>Login to discover your favourite movies.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p>Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>

        <br>

        <a href="{{ url_for('home') }}">← Back to Home</a>

    </div>

</body>
</html>
