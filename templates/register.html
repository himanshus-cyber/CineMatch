<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CineMatch</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        body {
            background: #090909;
            color: white;
            font-family: Arial, sans-serif;
        }

        .register-container {
            width: 380px;
            max-width: 90%;
            margin: 80px auto;
            padding: 35px;
            background: #181818;
            border-radius: 12px;
            text-align: center;
        }

        .register-container h1 {
            margin-bottom: 10px;
        }

        .register-container span {
            color: #e50914;
        }

        .register-container input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            background: #292929;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .register-container button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .register-container button:hover {
            background: #b20710;
        }

        .register-container a {
            color: #e50914;
            text-decoration: none;
        }

        .message {
            color: #ff7777;
            margin: 10px 0;
        }

    </style>

</head>

<body>

    <div class="register-container">

        <h1>CINE<span>MATCH</span></h1>

        <h2>Create Account</h2>

        <p>Join CineMatch and discover movies!</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Create Password"
                minlength="8"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <p>Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

        <br>

        <a href="{{ url_for('home') }}">← Back to Home</a>

    </div>

</body>
</html>
